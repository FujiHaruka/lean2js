name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Regenerate the package
        run: lake exe leants LeanTs.Example --out packages/verified-example
      - name: Generated package is up to date
        run: git diff --exit-code -- packages/verified-example
      - name: The user package template builds and emits
        run: ./scripts/check-template.sh

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package:check
